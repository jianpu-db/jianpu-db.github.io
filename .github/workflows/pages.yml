name: Deploy to GitHub Pages

# 把前端发到 **GitHub Pages**。
#
# 站点: **https://jianpu-db.github.io/** —— 仓库是组织站 `jianpu-db/jianpu-db.github.io`
#
# ⚠ 2026-09-30: **正式域名是 https://jianpu-db.org/**（Cloudflare Worker, 有写回: 投稿/补属性/补标签）。
#   这条流水线发的这份从现在起是**只读镜像**（老链接与备份用途）; 它页面上的提示会把人指到域名,
#   canonical 也指域名。两份产物都要重建 —— 只重建一份会出现"镜像与正式站不是同一版代码"。
# (`<org>.github.io` 这种仓库发在**域名根**; 普通项目仓库才在 `/<repo>/` 子路径。
#  两种位置产物都支持: index.html 里那段内联 <base> 会按"文档地址 = 应用根 + 可能多的 s/<id>"
#  摆正相对路径 —— 自检里跑的正是更难的子路径那种。)
#
# 为什么这条不需要语料/Python/wrangler: 产物是**纯静态**的 —— 检索/卡片/谱页全在浏览器里跑;
# `data/songs.jsonl.gz` + `stats.json` 已入库; 深链靠 `404.html`(内容与 index.html 逐字节相同);
# 没有 Worker, 所以构建时注入只读开关(投稿/补标签给"请到 pages.dev"的人话)。
#
# ⚠ 两件事都要做, 因为 Pages 的 **Source 有两种模式**, 发的东西不一样:
#   ① **"GitHub Actions"** —— 发的是本 workflow 上传的 artifact;
#   ② **"Deploy from a branch"** —— 发的是**仓库源码树的那个分支**(根目录没有 index.html 就是 404),
#      而且这种模式下同一次 push 触发的分支构建会**覆盖** artifact 的发布
#      (2026-09-25 实测: 取回首页先是产物, 一分多钟后变回仓库树)。
#   所以本 workflow 两手都做:
#     * **同步构建产物到仓库根**(index.html / 404.html / .nojekyll / static/*.<hash>.js)并提交 —— 分支模式靠它;
#     * 走 Actions 的 configure/upload/deploy-pages —— Actions 模式靠它; 两边内容相同, 不打架。
#   最后**取回首页比对哈希**: 必须能拿回这一次构建的那个 `static/app.<hash>.js`, 才算出货。
#
# 想只保留"干净"的 Actions 模式: Pages 的 Source 改成 'GitHub Actions', 再删掉仓库根那几件产物
# (index.html / 404.html / .nojekyll / static/*.<hash>.js), 本 workflow 会自动只走 Actions 那条。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write        # 同步产物到仓库根要提交
  pages: write
  id-token: write

concurrency:
  group: pages
  # 发布**故意不取消**正在跑的那次(官方模板也是 false): 取消会在列表里留个红叉, 看着像失败。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.probe.outputs.on }}
      entry: ${{ steps.info.outputs.entry }}      # 这次构建的入口 JS(static/app.<hash>.js), 给 deploy job 比对
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本仓库那套 Pages 自检: 产物断言 + 按 Pages 真实规矩起的静态服务(runner 上没有 geckodriver,
      # 真浏览器那步自己跳过)。**哪种模式都跑** —— 它才是"代码没坏"的证据。
      - name: 自检（GH Pages 规矩）
        run: JIANPU_QUICK=1 bash tools/check_gh_pages.sh

      - name: 构建产物
        run: node tools/build_dist.mjs --target gh --out dist

      - name: 产物断言
        id: info
        run: |
          set -eu
          test -f dist/.nojekyll
          test ! -e dist/_headers
          cmp -s dist/404.html dist/index.html
          test -s dist/data/songs.jsonl.gz
          grep -q 'window.JIANPU_READONLY=true;' dist/index.html
          entry=$(grep -o 'static/app\.[0-9a-f]*\.js' dist/index.html | head -1)
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
          echo "入口: $entry"
          echo "产物 OK: $(find dist -type f | wc -l) 个文件, $(du -sh dist | cut -f1)"

      # ① 分支模式要用: 把产物摊到仓库根(与源码不冲突: 产物是带内容哈希的文件名)。
      #    只在真有变化时提交, 带 [skip ci] 免得自激。
      - name: 同步产物到仓库根（分支模式靠这个发货）
        run: |
          set -eu
          cp dist/index.html dist/404.html dist/.nojekyll .
          # 先清掉**旧的带哈希产物**(app.<hash>.js / search.<hash>.js / style.<hash>.css)——
          # 分支模式同步会一遍遍往里拷, 不清就会一直攒(仓库根那 4 个旧文件就是这么来的)。
          # 注意模式里那个点: `app.*.js` 只匹配带哈希的名字, **不会**碰源码 `static/app.js`。
          rm -f static/app.*.js static/search.*.js static/jptok.*.js static/style.*.css
          cp dist/static/* static/
          cp dist/data/* data/
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A index.html 404.html .nojekyll static data
          if git diff --staged --quiet; then
            echo "仓库根上的产物已经是最新的, 不用提交"
          else
            git commit -m "chore(pages): 同步构建产物到仓库根 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME:-master}"    # 万一 checkout 落在 detached HEAD 也能推
            echo "已提交并推送(分支模式的 Pages 会在一两分钟内重新构建)"
          fi

      - name: Pages 走 Actions 吗（读配置）
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
                 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || echo 000)
          echo "GET /repos/$GITHUB_REPOSITORY/pages -> $code $(head -c 120 /tmp/pages.json)"
          if [ "$code" = 404 ]; then
            echo "on=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages 未启用::去 Settings → Pages → Build and deployment → Source 选 'GitHub Actions'（或选分支）。本次只构建+同步, 没走 Actions 发布。"
          else
            # 探测不到(403/限流/字段变化)也试一次 —— 发布后有"取回首页比对哈希"把关。
            echo "on=1" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.probe.outputs.on == '1'
        uses: actions/configure-pages@v5

      - if: steps.probe.outputs.on == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # ② 出货判据: 站点上必须能取到**这一次构建的那份** index.html(按入口 JS 的哈希比对)。
      #    Actions 模式几秒生效; 分支模式要等分支构建(约 1 分钟) —— 所以给足 5 分钟。
      - name: 发布后实测（取回首页 + 比对哈希）
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          # 期望值由 build job 传过来 —— 这个 job **没有 checkout**, 手上没有 dist/
          want="${{ needs.build.outputs.entry }}"
          if [ -z "$want" ]; then echo "::error::build job 没给出入口 JS 哈希(needs.build.outputs.entry 为空)"; exit 1; fi
          echo "期望入口: $want"
          got=""
          for i in $(seq 1 15); do
            body=$(curl -sL -m 20 "$url" || true)
            got=$(printf '%s' "$body" | grep -o 'static/app\.[0-9a-f]*\.js' | head -1 || true)
            if [ "$got" = "$want" ]; then echo "✓ $url 正在发这一次的构建产物(第 $i 次取回)"; exit 0; fi
            echo "  第 $i 次: 站点上是 '${got:-无}', 还等 20s…"
            sleep 20
          done
          echo "::error title=站点没有发这一次的构建产物::$url 上取到的是 '${got:-空}'。分支模式下请确认这次提交里仓库根的 index.html 已更新(看上面『同步产物』那步); 想走 Actions 就把 Settings → Pages → Source 改成 'GitHub Actions'。"
          exit 1
