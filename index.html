<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jianpu-db | 通过简谱旋律查歌</title>
<!-- 分享卡片与爬虫（2026-09-30 有正式域名 jianpu-db.org 之后加）。
     ⚠ 这里的地址**必须是绝对 URL**（og:image / canonical 用相对路径社交平台与爬虫都读不到）；
     `og.png` 特意不参与内容哈希改名（见 tools/build_dist.mjs），不然这个地址会随构建乱变。
     `canonical` 指向正式域名: GitHub Pages 那份是**镜像**，别让搜索引擎把它当两份内容。 -->
<meta name="description" content="简谱旋律查歌：只哼开头几个音（如 5 5 6 5 3 2 1），从 1 万多首简谱里把这首歌找出来。检索完全在你的浏览器里跑，不上传、不留痕。">
<link rel="canonical" href="https://jianpu-db.org/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="jianpu-db">
<meta property="og:title" content="jianpu-db | 通过简谱旋律查歌">
<meta property="og:description" content="哼开头几个音，把简谱找出来。11,000+ 首、200 万+ 音符，检索全在浏览器里跑。">
<meta property="og:url" content="https://jianpu-db.org/">
<meta property="og:image" content="https://jianpu-db.github.io/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="jianpu-db：通过简谱旋律查歌 —— 一行简谱数字 5 6 5 3 2 1 2 | 3 5 6 5 3">
<!-- 结构化数据（2026-09-30）: 告诉搜索引擎"这是个能站内搜的站点"。
     `?q=` 前端本来就支持（app.js: `?q=… -> 直接替用户查一次`），所以 SearchAction 是真能用的。 -->
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"jianpu-db",
 "alternateName":"简谱旋律查歌","url":"https://jianpu-db.org/","inLanguage":"zh-CN",
 "description":"只哼开头几个音，从一万多首简谱里把这首歌找出来；检索完全在浏览器里跑。",
 "potentialAction":{"@type":"SearchAction",
   "target":{"@type":"EntryPoint","urlTemplate":"https://jianpu-db.org/?q={search_term_string}"},
   "query-input":"required name=search_term_string"}}
</script>
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="jianpu-db | 通过简谱旋律查歌">
<meta name="twitter:description" content="哼开头几个音，把简谱找出来。11,000+ 首、200 万+ 音符。">
<meta name="twitter:image" content="https://jianpu-db.github.io/static/og.png">
<meta name="theme-color" content="#0b62c4">
<!-- 站标: 内联 SVG(数字 123 就是简谱的样子), 免得再加一个请求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b62c4'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial' font-size='34' font-weight='bold' fill='white' text-anchor='middle'%3E123%3C/text%3E%3C/svg%3E">
<!-- ⚠ 这一小段必须留在**最前面**, 而且必须是内联的(不能搬进 app.js)。
     为什么: 谱页的地址是 `/s/<id>`, 在这个地址上相对路径 `./static/app.3a8cd15f.js` 会被浏览器解析成
     `/s/static/app.js`(404) -> 深链/刷新整片白屏(2026-09-24 实测)。这里按"文档地址 = 应用根 +
     可能是 s/<id>"把 <base> 摆正, 后面所有相对路径就都对得上了; 部署到子目录
     (如 user.github.io/jianpu-web/) 也照样对 —— 不用按部署位置改 HTML。 -->
<script>
(function () {
  var p = location.pathname, m = /^(.*\/)s\/[^/]+\/?$/.exec(p);
  var root = m ? m[1] : p.slice(0, p.lastIndexOf('/') + 1);   // 去掉末尾的 s/<id> 或文件名
  var b = document.createElement('base');
  b.href = root || '/';
  var h = document.head || document.getElementsByTagName('head')[0];
  h.insertBefore(b, h.firstChild);
})();
</script>
<link rel="stylesheet" href="./static/style.d07e975a.css">
<script>window.JIANPU_READONLY=true;</script>
</head>
<body>
<div class="wrap">

  <!-- 「每谱一页」的容器: /s/<id> 深链时由 app.js 填内容, 首页整块 #home 藏起来。 -->
  <div id="tune" hidden></div>

  <div id="home">

  <h1>简谱旋律查歌</h1>
  <p class="lead">输入唱名数字（1–7），查出歌名。时值、八度、升降号可省。
    空格不分段，用逗号分段更准。</p>

  <form id="form">
    <input type="text" id="q" autocomplete="off" placeholder="例如 1155665 4433221">
    <button type="submit" id="go">查</button>
  </form>

  <p class="examples">例子：
    <a href="#" class="ex" data-q="1155665 4433221" title="小星星（一闪一闪亮晶晶）">1155665 4433221</a>
    <a href="#" class="ex" data-q="1231 1231 345 345" title="两只老虎">1231 1231 345 345</a>
    <a href="#" class="ex" data-q="33561165565" title="茉莉花">33561165565</a>
  </p>

  <p id="status" class="status">加载中…</p>
  <div id="out"></div>

  <h2>按曲名找</h2>
  <p class="lead">核对元数据、补收录页或标签。</p>
  <form id="tform">
    <input type="text" id="tq" autocomplete="off" placeholder="例如 月亮代表我的心">
    <button type="submit" id="tgo">找</button>
  </form>
  <p id="tstatus" class="status"></p>
  <div id="tout"></div>

  <h2>投稿 / 纠错（不用登录）</h2>
  <form id="sform">
    <p>
      <label for="skind">类型</label>
      <select id="skind">
        <option value="new">推荐收录</option>
        <option value="fix">纠错</option>
        <option value="meta">改元数据</option>
      </select>
    </p>
    <p>
      <label for="stitle">曲名</label>
      <input type="text" id="stitle" size="30" placeholder="必填">
      <button type="button" id="sfill">用刚查到的</button>
    </p>
    <p>
      <label for="sscore">简谱数字（可选）</label>
      <input type="text" id="sscore" size="46" placeholder="例如 1 1 5 5 6 6 5（小星星）">
    </p>
    <p>
      <label for="snote">说明（可选）</label>
      <input type="text" id="snote" size="46" placeholder="原谱链接、哪里不对…">
    </p>
    <p>
      <label for="scontact">联系方式（可选）</label>
      <input type="text" id="scontact" size="20">
      <button type="submit" id="sgo">提交</button>
    </p>
  </form>
  <p id="sstatus" class="status"></p>

  <footer>
    <span id="stats"></span><br>
    语料来自 <a href="https://github.com/Francium-223/jianpu-db" target="_blank" rel="noopener">Francium-223/jianpu-db</a>；检索在你的浏览器里完成。
  </footer>

  </div><!-- /#home -->

  <!-- 标签词表: 补标签的输入框都挂它(首页/谱页共用), 所以放在两个容器外面 -->
  <datalist id="taglist"></datalist>

</div>
<script src="./static/app.3a8cd15f.js" type="module"></script>
</body>
</html>
